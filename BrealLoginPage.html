<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome back </title>
  <link rel="stylesheet" href="BrealLoginPage.css">
</head>
<body>
  <div class="container">
    <div class="content">
      <div class="signInDetails">
      <div class="Logo">
        <div class="logo1"></div>
        <div class="logo2"></div>
        <div class="logo3"></div>
        <h3 class="BrealN">Breal Client Login</h3            >
      </div>
      <h3>Welcome Back</h3>
      <p>Access the progress of your project</p>
      <div class="InputContainer">
        <p>Username or Email</p>
        <input type="email" class="DataInput email" placeholder="e.g potentialcustomer@gmail.com" required>
        <i></i>
      </div>
      <div class="InputContainer">
        <p>Password</p>
        <input type="password" placeholder="Enter your password" class="DataInput password" required>
        <i src="images/unlock.png"></i>
      </div>
      <div class="TermsandC">
        <input type="checkbox">
        <p class="Tandc">Agree to terms and condition</p>
      </div>
      <div class="TermsandC"><input type="checkbox" class="rememberMe"><p class="Tandc">Remember me</p></div>
      <button class="LoginBtn">LOGIN</button>
      <p>Not registered?<button class="signupBtn">Signup</button></p>
      </div>
      <div class="signupImg"></div>
    </div>
    <div class="ImgRef">
      <img class="signUpImg" src="" alt="Work display">
      <div class="SignupCont">
        <h3>Welcome, you're about to make a very good decision</h3>
        <div class="InputContainer">
          Username
          <input class="newUsername DataInput" type="text" placeholder="Username">
        </div>
        <div class="InputContainer">Fullname
          <input class="fullname DataInput" type="text" placeholder="Fullname e.g Dolapo Chinedu Diko">
        </div>
        <div class="InputContainer">Email
          <input class="signupEmail DataInput" type="email" placeholder="e.g name@email.com">
        </div>
        <div class="InputContainer">Password
          <input class="SignupPassword DataInput" type="password" placeholder="password">
        </div>
        <div class="InputContainer">Confirm Password
          <input class="passwordConfirm DataInput" type="password" placeholder="confirm password">
        </div>
  
        <div><input type="checkbox" class="rememberMe"> <p class="Tandc">Remember me</P></div>
        <button class="getInBtn">SIGN UP</button>
        <p>Already signup before? <button class="signinBtn">SignIn</button></p>
      </div>
    </div>
  </div>
  <script src="BrealLoginP.js"></script>
</body>

</html>
